[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basic-memory-mcp"
version = "0.1.0"
description = "An MCP server that gives a model a persistent notebook backed by a folder of Markdown files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.1,<4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
basic-memory-mcp = "basic_memory_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/basic_memory_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
